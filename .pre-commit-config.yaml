repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.1.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: node_modules/.bin/oxlint
        language: system
        types_or: [javascript, jsx, ts, tsx]
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v2.7.1"
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx]
